<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>VaniKhata - Voice Test</title>
  <style>
    /* 1. वेलकम स्क्रीन की स्टाइल */
    #welcome-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: #2563eb; /* नीला बैकग्राउंड */
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 32px;
        z-index: 9999; /* यह सबसे ऊपर दिखेगा */
        font-family: Arial, sans-serif;
        transition: opacity 1s ease, visibility 1s; /* गायब होने का एनीमेशन */
    }

    /* गायब होने के बाद के लिए क्लास */
    .fade-out {
        opacity: 0;
        visibility: hidden;
    }
    
    /* 2. मुख्य पेज (Body) की स्टाइल */
    body {
        background-image: url("back.jpg");
        background-repeat: no-repeat; /* repeat को नो-रिपीट किया ताकि इमेज फैले, बार-बार न दिखे */
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 100px;
        background-color: #f4f6f8; /* इमेज न होने पर यह रंग दिखेगा */
    }

    /* 3. बटन और आउटपुट बॉक्स की स्टाइल */
    .mic-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px 30px; 
      font-size: 30px;
      border-radius: 50px;
      cursor: pointer;
    }
    .mic-btn:hover {
      background: #1d4ed8;
    }
    #output {
      margin-top: 25px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      min-height: 80px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      border: 1px solid #ddd;
      font-size: 18px;
    }
    .status {
      color: #666;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- वेलकम स्क्रीन को यहाँ <body> के ठीक नीचे होना चाहिए -->
  <div id="welcome-screen">
    <h1>Welcome to my website</h1>
  </div>

  <!-- आपका मुख्य कंटेंट -->
  <h2>VaniKhata Voice test by prince kumar</h2>
  <button class="mic-btn" onclick="startVoice()">Mic On Karein 🎙️</button>
  <div class="status" id="status">Button par click karein aur bole...</div>

  <div id="output">Aap jo bolenge, yahan likha aayega...</div>

  <!-- जावास्क्रिप्ट कोड (माइक और स्क्रीन हटाने दोनों के लिए) -->
  <script>
    // वेलकम स्क्रीन को 3 सेकंड बाद हटाने के लिए
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const welcome = document.getElementById('welcome-screen');
            welcome.classList.add('fade-out');
        }, 3000); 
    });

    // आपका पुराना वॉइस रिकग्निशन कोड
    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        alert("Aapka browser voice support nahi karta. Google Chrome use karein.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      
      const statusText = document.getElementById('status');
      const outputDiv = document.getElementById('output');

      recognition.onstart = function() {
        statusText.innerText = "Sun raha hoon... Boliye!";
        statusText.style.color = "green";
      };

      recognition.onspeechend = function() {
        statusText.innerText = "Aawaz process ho rahi hai...";
        recognition.stop();
      };

      recognition.onresult = function(event) {
        const spokenText = event.results[0][0].transcript;
        outputDiv.innerText = spokenText;
        statusText.innerText = "Complete! Agli aawaz ke liye dobara click karein.";
        statusText.style.color = "#666";
      };

      recognition.onerror = function(event) {
        statusText.innerText = "Error: " + event.error;
        statusText.style.color = "red";
      };

      recognition.start();
    }
  </script>

</body>
</html>
